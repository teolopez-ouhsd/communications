# Move this file to .github/workflows/home-field-backgrounds.yml in the repo root
name: Home Field backgrounds
on:
  push:
    paths:
      - 'communications/home-field/backgrounds/originals/**'
      - 'home-field/backgrounds/originals/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build backgrounds
        run: python3 "$(find . -name build-backgrounds.py -path '*home-field/backgrounds*' | head -1)"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update Home Field backgrounds" && git push)
